<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0A12">
<title>Rakib Mohammad Ammar — Portfolio</title>
<meta name="description" content="Rakib Mohammad Ammar — CSE Graduate, Software Developer & Digital Services Provider, IELTS/TOEFL/Duolingo Trainer, STEM Subject Teacher, prospective MSc researcher in AI, HCI & Cyber Security.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7C5CFF; --accent-2:#A78BFA; --accent-soft:rgba(124,92,255,.14);
  --radius:16px; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --head:'Poppins',var(--sans); --ease:cubic-bezier(.22,.9,.32,1);
}
html[data-theme="dark"]{
  --bg:#0B0A12; --bg-soft:#0F0E18; --card:#15131F; --card-2:#1B1929; --border:#2A2740;
  --text:#EDEAF7; --text-dim:#A79FC2; --text-faint:#6C6485; --shadow:0 20px 50px rgba(0,0,0,.45);
  --star:rgba(255,255,255,.55);
}
html[data-theme="light"]{
  --bg:#FAF8F5; --bg-soft:#F3F0EC; --card:#FFFFFF; --card-2:#F5F2ED; --border:#E7E2F0;
  --text:#221D33; --text-dim:#5E5876; --text-faint:#8B84A3; --shadow:0 20px 45px rgba(90,70,150,.12);
  --star:rgba(124,92,255,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} html{scroll-behavior:auto;} }
body{background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.65; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; transition:background .25s var(--ease), color .25s var(--ease);}
h1,h2,h3,h4{font-family:var(--head); font-weight:700; letter-spacing:-.01em;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
::selection{background:var(--accent); color:#fff;}
::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
button{font-family:var(--sans); cursor:pointer; background:none; border:none; color:inherit;}

#stars{position:fixed; inset:0; z-index:0; pointer-events:none;}

/* ---------- Nav ---------- */
header.nav{
  position:sticky; top:0; z-index:200; backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1180px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px;}
.logo{font-family:var(--head); font-weight:700; font-size:19px;}
.logo span{color:var(--accent);}
.nav-links{display:flex; gap:6px; align-items:center;}
.nav-links a{padding:9px 15px; border-radius:10px; font-size:14.5px; font-weight:500; color:var(--text-dim); transition:all .2s var(--ease);}
.nav-links a:hover{color:var(--text); background:var(--card-2);}
.nav-links a.active{color:var(--accent); background:var(--accent-soft);}
.nav-right{display:flex; align-items:center; gap:10px;}
.theme-btn{
  width:40px; height:40px; border-radius:50%; background:var(--card-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:17px; transition:transform .2s var(--ease), background .2s;
}
.theme-btn:hover{transform:rotate(15deg); background:var(--accent-soft);}
.menu-toggle{display:none; width:40px; height:40px; border-radius:10px; background:var(--card-2); border:1px solid var(--border); align-items:center; justify-content:center; font-size:18px;}

@media (max-width:880px){
  .nav-links{
    position:fixed; top:72px; left:0; right:0; bottom:0; background:var(--bg);
    flex-direction:column; align-items:stretch; padding:18px; gap:4px;
    transform:translateX(100%); transition:transform .3s var(--ease); overflow-y:auto;
  }
  .nav-links.open{transform:translateX(0);}
  .nav-links a{padding:14px 16px; font-size:16px;}
  .menu-toggle{display:flex;}
}

/* ---------- Layout helpers ---------- */
main{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 28px;}
.page{padding:64px 0 100px; min-height:60vh;}
.eyebrow{display:inline-block; font-size:13px; font-weight:600; color:var(--accent); letter-spacing:.04em; text-transform:uppercase; margin-bottom:14px;}
.h-title{font-size:clamp(28px,4vw,42px); margin-bottom:18px;}
.h-title .accent{color:var(--accent);}
.sub{color:var(--text-dim); font-size:16px; max-width:64ch; margin-bottom:10px;}
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:14px; font-weight:500; margin-bottom:26px; transition:color .2s;}
.back-link:hover{color:var(--accent);}

.reveal{opacity:0; transform:translateY(16px); transition:opacity .55s var(--ease), transform .55s var(--ease);}
.reveal.show{opacity:1; transform:none;}

.btn{
  display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:12px; font-weight:600; font-size:14.5px;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s, color .18s, border-color .18s; border:1px solid transparent;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(124,92,255,.4);}
.btn-outline{border-color:var(--border); color:var(--text);}
.btn-outline:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-2px);}

/* ---------- Hero ---------- */
.hero{padding:70px 0 40px; display:flex; align-items:center; gap:56px; flex-wrap:wrap-reverse; min-height:80vh;}
.hero-text{flex:1; min-width:300px;}
.hero-photo-wrap{position:relative; flex-shrink:0; margin:0 auto;}
.hero-photo{
  width:270px; height:330px; object-fit:cover; border-radius:20px; border:1px solid var(--border);
  box-shadow:var(--shadow); position:relative; z-index:1;
}
.hero-photo-wrap::before{
  content:''; position:absolute; inset:14px -14px -14px 14px; border:2px solid var(--accent); border-radius:20px; opacity:.5;
}
.hero-name{font-size:clamp(30px,5vw,46px); margin:8px 0 12px;}
.hero-roles{color:var(--text-dim); font-size:15.5px; max-width:56ch; margin-bottom:26px; line-height:1.7;}
.hero-ctas{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:34px;}
.hero-stats{display:flex; gap:20px; flex-wrap:wrap;}
.hstat{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 20px; min-width:120px; transition:transform .2s;}
.hstat:hover{transform:translateY(-4px); border-color:var(--accent);}
.hstat b{display:block; font-size:22px; color:var(--accent); font-family:var(--head);}
.hstat span{font-size:12px; color:var(--text-faint);}

/* ---------- Cards / grid ---------- */
.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; margin-top:8px;}
.box-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:28px;
  transition:transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease); cursor:pointer;
  display:flex; flex-direction:column; gap:12px;
}
.box-card:hover{transform:translateY(-6px); border-color:var(--accent); box-shadow:var(--shadow);}
.box-icon{
  width:48px; height:48px; border-radius:12px; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.box-card h3{font-size:18px;}
.box-card p{color:var(--text-dim); font-size:14.5px;}
.box-arrow{color:var(--accent); font-weight:600; font-size:14px; margin-top:auto;}

/* ---------- Bio / about ---------- */
.about-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:start;}
@media (max-width:900px){.about-grid{grid-template-columns:1fr;}}
.role-badge{
  background:var(--accent-soft); border:1px solid rgba(124,92,255,.35); color:var(--accent);
  padding:14px 18px; border-radius:12px; font-size:14px; font-weight:600; line-height:1.6; margin:22px 0 26px;
}
.about-photo{width:100%; max-width:340px; border-radius:18px; border:1px solid var(--border); box-shadow:var(--shadow);}

/* ---------- Timeline (alternating) ---------- */
.timeline{position:relative; margin-top:20px;}
.timeline::before{content:''; position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--border); transform:translateX(-50%);}
@media (max-width:760px){.timeline::before{left:18px;}}
.t-item{position:relative; display:flex; margin-bottom:36px;}
.t-item:nth-child(odd){justify-content:flex-start;}
.t-item:nth-child(even){justify-content:flex-end;}
.t-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px;
  width:calc(50% - 40px); position:relative; transition:transform .2s, border-color .2s;
}
.t-card:hover{transform:translateY(-3px); border-color:var(--accent);}
.t-dot{
  position:absolute; left:50%; top:26px; width:14px; height:14px; border-radius:50%; background:var(--accent);
  transform:translateX(-50%); box-shadow:0 0 0 5px var(--accent-soft); z-index:1;
}
@media (max-width:760px){
  .t-item, .t-item:nth-child(even){justify-content:flex-start;}
  .t-card{width:calc(100% - 50px); margin-left:50px;}
  .t-dot{left:18px;}
}
.t-time{font-size:12.5px; color:var(--accent); font-weight:600; margin-bottom:6px;}
.t-title{font-size:16.5px; font-weight:700; margin-bottom:4px;}
.t-sub{font-size:13.5px; color:var(--text-faint); margin-bottom:8px;}
.t-cgpa{display:inline-block; margin-top:8px; background:var(--accent); color:#fff; font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:20px;}

/* ---------- score tables ---------- */
.score-wrap{margin-top:44px;}
.score-table{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden; max-width:560px;}
.score-table div{background:var(--card); padding:14px 8px; text-align:center;}
.score-table .h{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em;}
.score-table .v{font-size:19px; font-weight:700; color:var(--accent); font-family:var(--head);}

/* ---------- Detail sections generic ---------- */
.detail-block{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:28px 30px; margin-bottom:22px;}
.detail-block h3{font-size:18px; margin-bottom:10px;}
.detail-block .meta{font-size:13px; color:var(--accent); font-weight:600; margin-bottom:12px;}
.detail-block p{color:var(--text-dim); font-size:14.5px;}
.detail-block ul{margin:12px 0 0 18px; color:var(--text-dim); font-size:14.5px;}
.detail-block ul li{margin-bottom:7px;}

/* alternating service list */
.svc-list{margin-top:10px;}
.svc-item{display:flex; gap:20px; align-items:flex-start; margin-bottom:22px;}
.svc-item.rev{flex-direction:row-reverse; text-align:right;}
.svc-num{
  flex-shrink:0; width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--head);
}
.svc-body{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 22px; flex:1; transition:transform .2s, border-color .2s;}
.svc-body:hover{transform:translateY(-3px); border-color:var(--accent);}
.svc-body h4{font-size:15.5px; margin-bottom:6px;}
.svc-body p{font-size:14px; color:var(--text-dim);}
@media (max-width:640px){.svc-item.rev{flex-direction:row; text-align:left;}}

/* pill tags */
.tag-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.tag{font-size:12px; padding:5px 12px; border-radius:20px; background:var(--card-2); border:1px solid var(--border); color:var(--text-dim);}

/* project cards */
.proj-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:18px; transition:border-color .2s;}
.proj-card:hover{border-color:var(--accent);}
.proj-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
.proj-head h4{font-size:16.5px;}
.proj-note{
  margin-top:14px; padding:14px 16px; border-radius:10px; background:var(--accent-soft); color:var(--accent);
  font-size:13.5px; display:none; font-weight:500;
}
.proj-note.open{display:block;}
.proj-toggle{font-size:13px; color:var(--accent); font-weight:600; border:1px solid var(--border); padding:8px 14px; border-radius:8px; transition:all .2s;}
.proj-toggle:hover{background:var(--accent-soft); border-color:var(--accent);}

/* Skills tabs */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px;}
.tab-btn{padding:10px 18px; border-radius:24px; border:1px solid var(--border); font-size:13.5px; font-weight:600; color:var(--text-dim); transition:all .2s;}
.tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.tab-btn:hover:not(.active){border-color:var(--accent); color:var(--accent);}
.skill-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
.skill-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; align-items:center; gap:12px; transition:transform .2s, border-color .2s;}
.skill-card:hover{transform:translateY(-3px); border-color:var(--accent);}
.skill-badge{width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#fff; flex-shrink:0;}
.skill-card span.name{font-size:13.5px; font-weight:600;}

/* Awards */
.award-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:26px; display:flex; gap:16px; align-items:flex-start; transition:transform .2s, border-color .2s;}
.award-card:hover{transform:translateY(-5px); border-color:var(--accent);}
.award-icon{width:44px; height:44px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
.award-card p{color:var(--text-dim); font-size:14px;}

/* Contact */
.social-row{display:flex; flex-wrap:wrap; gap:12px; margin:24px 0 32px;}
.social-btn{width:50px; height:50px; border-radius:14px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-dim); transition:all .22s var(--ease);}
.social-btn svg{width:20px; height:20px; fill:currentColor;}
.social-btn:hover{transform:translateY(-4px); color:#fff; background:var(--accent); border-color:var(--accent); box-shadow:0 10px 24px rgba(124,92,255,.35);}
.contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:600px; margin-bottom:36px;}
@media (max-width:560px){.contact-grid{grid-template-columns:1fr;}}
.contact-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; transition:transform .2s;}
.contact-card:hover{transform:translateY(-3px);}
.contact-card .k{font-size:11px; color:var(--text-faint); text-transform:uppercase; margin-bottom:6px; font-weight:600;}
.contact-card .v a:hover{color:var(--accent);}
.contact-form{max-width:640px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:32px;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
@media (max-width:520px){.form-row{grid-template-columns:1fr;}}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12px; color:var(--text-faint); font-weight:600; text-transform:uppercase;}
.field input,.field select,.field textarea{
  background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text);
  font-family:var(--sans); font-size:16px; width:100%; transition:border-color .18s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent);}
.field textarea{resize:vertical; min-height:110px;}
.form-status{font-size:13.5px; margin-top:14px; display:none; font-weight:500;}
.form-status.ok{display:block; color:#2fbf71;}
.form-status.err{display:block; color:#f16565;}
.form-note{font-size:12.5px; color:var(--text-faint); margin-top:14px;}

footer{border-top:1px solid var(--border); padding:30px 28px calc(30px + env(safe-area-inset-bottom)); text-align:center; font-size:13px; color:var(--text-faint); position:relative; z-index:1;}

.back-to-top{position:fixed; bottom:24px; right:24px; width:46px; height:46px; border-radius:50%; background:var(--card); border:1px solid var(--border); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:18px; z-index:150; opacity:0; pointer-events:none; transform:translateY(10px); transition:all .25s var(--ease);}
.back-to-top.show{opacity:1; pointer-events:auto; transform:none;}
.back-to-top:hover{background:var(--accent); color:#fff; border-color:var(--accent);}

@media (max-width:640px){ .page{padding:44px 0 70px;} main{padding:0 18px;} .hero{padding-top:40px;} }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header class="nav">
  <div class="nav-inner">
    <a href="#home" class="logo">Rakib's <span>Portfolio</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#home" data-route="home">Home</a>
      <a href="#about" data-route="about">About</a>
      <a href="#experience" data-route="experience">Experience</a>
      <a href="#awards" data-route="awards">Awards</a>
      <a href="#activities" data-route="activities">Activities</a>
      <a href="#skills" data-route="skills">Skills</a>
      <a href="#contact" data-route="contact">Contact</a>
    </nav>
    <div class="nav-right">
      <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
    </div>
  </div>
</header>

<main id="app"></main>
<button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

<footer>© <span id="year"></span> Rakib Mohammad Ammar · Built &amp; hosted on GitHub Pages</footer>

<script>
/* ============ THEME ============ */
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
function setTheme(t){
  html.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('theme', t);
}
setTheme(localStorage.getItem('theme') || 'dark');
themeBtn.addEventListener('click', ()=> setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ============ MOBILE NAV ============ */
const navLinks = document.getElementById('navLinks');
document.getElementById('menuToggle').addEventListener('click', ()=> navLinks.classList.toggle('open'));
navLinks.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=> navLinks.classList.remove('open')));

document.getElementById('year').textContent = new Date().getFullYear();

/* ============ STARFIELD ============ */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas(){
  canvas.width = window.innerWidth; canvas.height = document.documentElement.scrollHeight;
  const count = Math.floor((canvas.width * Math.min(canvas.height, 3000)) / 9000);
  stars = Array.from({length: Math.min(count, 220)}, ()=> ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: Math.random()*1.4 + 0.3, s: Math.random()*0.02 + 0.005, p: Math.random()*Math.PI*2
  }));
}
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const color = getComputedStyle(html).getPropertyValue('--star').trim();
  stars.forEach(st=>{
    st.p += st.s;
    const alpha = reducedMotion ? 0.5 : (Math.sin(st.p)+1)/2 * 0.7 + 0.15;
    ctx.beginPath();
    ctx.fillStyle = color.replace(/[\d.]+\)$/, alpha.toFixed(2)+')');
    ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas(); drawStars();

/* ============ BACK TO TOP ============ */
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', ()=> backToTop.classList.toggle('show', window.scrollY > 500));
backToTop.addEventListener('click', ()=> window.scrollTo({top:0, behavior: reducedMotion?'auto':'smooth'}));

/* ============ DATA ============ */
const SERVICES = [
  ["WordPress Bug Fixing & Speed Optimization","I diagnose and resolve WordPress errors, plugin conflicts, and broken layouts, then optimize page speed through caching, image compression, and code cleanup so client sites load faster and stay stable after updates."],
  ["Python Automation Script / Bot Development","I build custom Python scripts and bots that automate repetitive manual work — from auto-filling forms and sending scheduled emails to monitoring websites for changes — saving clients hours of manual effort every week."],
  ["REST API Development & Integration","I design and build REST APIs from scratch, and connect existing applications to third-party services, handling authentication, data mapping, and error handling so systems talk to each other reliably."],

function pageExpResearch(){
  return `<div class="page">
    ${backLink('#experience','Back to Experience')}
    <div class="eyebrow">Experience</div>
    <h2 class="h-title">Research <span class="accent">Experience</span></h2>

    <div class="detail-block reveal">
      <h3>Undergraduate Thesis</h3>
      <div class="meta">Supervisor: Zarin Rafah Chowdhury, Lecturer, Department of Computer Science and Engineering, Port City International University</div>
      <p style="font-weight:600; color:var(--text); margin-bottom:10px;">Bilingual Prescription Mining in Low-Resource Setting Using Fine-Tuned Transformer-Based Optical Character Recognition Model and Patient-Centric Summarization</p>
      <p>In low-resource healthcare settings such as Bangladesh, handwritten medical prescriptions remain the primary medium for conveying treatment instructions, yet their digitization is severely hindered by poor handwriting quality, mixed Bangla–English usage, and the scarcity of annotated data. This thesis presents an end-to-end bilingual handwritten prescription mining framework centered on a fine-tuned Transformer-based Optical Character Recognition (TrOCR) model for robust medicine name recognition. The model is fine-tuned on a curated OCR-crops dataset containing segmented medicine-name regions and evaluated under realistic prescription conditions. To enhance reliability, a lexicon-guided post-processing pipeline based on Levenshtein edit distance and multi-stage fallback matching is introduced to correct OCR errors using domain-specific constraints. Experimental results on the test set show that the raw TrOCR model achieves a Character Error Rate (CER) of 8.86% and a Word Error Rate (WER) of 27.96%, with an exact medicine-name accuracy of 73.13%. After post-processing, performance improves substantially, reducing CER to 5.87% and WER to 13.42%, while exact match accuracy increases to 88.06%. Beyond recognition, the corrected medicine names are enriched through linkage with a large-scale medicine knowledge base and a manually prepared prescription instruction dataset to extract strength, disease class, indications, frequency, and timing. The final system generates structured, patient-centric summaries in both English and Bangla with an embedded safety disclaimer. The proposed approach demonstrates that combining Transformer-based OCR with lexicon-driven correction and medical knowledge enrichment can significantly improve prescription digitization accuracy and usability in bilingual, low-resource healthcare environments.</p>
    </div>

    <div class="detail-block reveal">
      <h3>Course-Based Research — Digital Image Processing Lab</h3>
      <p style="font-weight:600; color:var(--text); margin-bottom:10px;">Heartbeat Sound Classification Using CNN-Based Hybrids and Ensemble Learning: Comparative Analysis with Machine Learning and Deep Learning Models</p>
      <p>Automated heartbeat sound classification is essential for intelligent cardiovascular screening and computer-aided diagnosis. This study presents a unified performance analysis of classical Machine Learning (ML), state-of-the-art Deep Learning (DL), Hybrid, and Ensemble frameworks applied to phonocardiogram signals. ML models (LR, SVM, KNN, RF, GBM, XGBoost, LightGBM, DT, NB) achieved competitive accuracies, with RF, GBM, and DT reaching 97%. DL architectures (CNN, LSTM, BiLSTM, GRU) exhibited robust temporal–spatial feature learning, where CNN and GRU achieved 97% accuracy. Hybrid models (CNN+LSTM, CNN+GRU, CNN+Bi-LSTM) delivered superior generalization with F1-scores of 0.9811, highlighting the benefit of joint spectral–sequential feature extraction. In contrast, Ensemble strategies with soft and hard voting reached 91%, indicating limited synergy compared to optimized standalone models. Overall, the findings demonstrate that advanced ML and hybrid DL pipelines offer reliable and scalable solutions for heartbeat sound classification, enabling integration into real-time diagnostic and clinical decision-support systems.</p>
      <div class="tag-row">
        <span class="tag">Phonocardiogram</span><span class="tag">Machine Learning</span><span class="tag">Deep Learning</span>
        <span class="tag">Hybrid Architecture</span><span class="tag">Ensemble Learning</span><span class="tag">Biomedical Signal Processing</span>
      </div>
    </div>

    <div class="detail-block reveal">
      <h3>Course-Based Research — Pattern Recognition Lab</h3>
      <p style="font-weight:600; color:var(--text); margin-bottom:10px;">ANN-Based Gender Classification Using Facial Measurement Features</p>
      <p>A pattern-recognition project applying an Artificial Neural Network to classify gender from structured facial measurement features such as forehead width and height, nose and lip proportions, and hair length — trained and evaluated on a labeled dataset of facial measurements.</p>
    </div>

    <div class="detail-block reveal">
      <h3>Course-Based Research — Statistical Analysis</h3>
      <p style="font-weight:600; color:var(--text); margin-bottom:10px;">Public Perceptions and Proposals on Mismanagement of the Local Transport System</p>
      <p>A statistical survey of 250 participants — drivers, passengers, and locals — examining public transport mismanagement in Bangladesh. The study looked at issues such as route inefficiency, safety concerns, and fare irregularities affecting daily commuters, and compiled participant-driven proposals for improving local transport management.</p>
    </div>
  </div>`;
}

function bindContactForm(){
  const form = document.getElementById('contactForm');
  if(!form) return;
  const status = document.getElementById('formStatus');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    status.className = 'form-status'; status.style.display='block'; status.style.color='var(--text-faint)';
    status.textContent = 'Sending...';
    try{
      const res = await fetch(form.action, {method:'POST', body:new FormData(form), headers:{'Accept':'application/json'}});
      if(res.ok){ status.className='form-status ok'; status.textContent="Message sent — thanks! I'll reply by email soon."; form.reset(); }
      else throw new Error();
    }catch(err){ status.className='form-status err'; status.textContent='Could not send right now — please email rakibmdammar@gmail.com directly.'; }
  });
}

const ROUTES = {
  'home': pageHome, 'about': pageAbout, 'about/academics': pageAcademics,
  'experience': pageExperience, 'experience/dev': pageExpDev, 'experience/teaching': pageExpTeaching,
  'experience/tutor': pageExpTutor, 'experience/work': pageExpWork, 'experience/research': pageExpResearch,
  'awards': pageAwards, 'activities': pageActivities, 'activities/course': pageActCourse,
  'activities/projects': pageActProjects, 'activities/extra': pageActExtra,
  'skills': pageSkills, 'contact': pageContact
};
const app = document.getElementById('app');
function render(){
  let hash = (location.hash || '#home').slice(1);
  if(!ROUTES[hash]) hash = 'home';
  app.innerHTML = ROUTES[hash]();
  window.scrollTo({top:0, behavior:'auto'});
  const top = hash.split('/')[0];
  document.querySelectorAll('.nav-links a').forEach(a=> a.classList.toggle('active', a.dataset.route === top));
  requestAnimationFrame(()=>{
    document.querySelectorAll('.reveal').forEach((el,i)=> setTimeout(()=> el.classList.add('show'), i*40));
  });
  if(hash === 'skills') bindSkillsTabs();
  if(hash === 'contact') bindContactForm();
  if(hash === 'activities/projects') bindProjectToggles();
  setTimeout(resizeCanvas, 60);
}
window.addEventListener('hashchange', render);
render();
